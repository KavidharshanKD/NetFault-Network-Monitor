{% extends 'base.html' %}

{% block title %}Edit Device — Automated Fault Detection System{% endblock %}
{% block page_title %}Edit Device: {{ device.device_name }}{% endblock %}

{% block content %}
    <div class="card" style="max-width: 650px;">
        <div class="card-header">
            <span class="card-title">Modify Device Configuration</span>
        </div>

        <form method="POST" action="{{ url_for('edit_device', device_id=device.id) }}">
            <div class="form-group">
                <label class="form-label" for="device_name">
                    Device Name <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="device_name" 
                    name="device_name" 
                    class="form-control" 
                    value="{{ device.device_name }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="ip_address">
                    IP Address (IPv4 or IPv6) <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="ip_address" 
                    name="ip_address" 
                    class="form-control mono" 
                    value="{{ device.ip_address }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="port">
                    TCP Port <span class="text-muted">(Optional)</span>
                </label>
                <input 
                    type="number" 
                    id="port" 
                    name="port" 
                    class="form-control mono" 
                    min="1" 
                    max="65535" 
                    value="{{ device.port or '' }}"
                >
                <div class="form-help">Leave blank to monitor reachability only.</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">
                    Description <span class="text-muted">(Optional)</span>
                </label>
                <textarea 
                    id="description" 
                    name="description" 
                    class="form-control"
                >{{ device.description or '' }}</textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    Update Device
                </button>
                <a href="{{ url_for('device_details', device_id=device.id) }}" class="btn">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
